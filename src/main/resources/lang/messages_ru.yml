  invalid-url: "&cНеверный URL пакета ресурсов. Обратитесь к администратору."
  already-loading: "&cПакет ресурсов уже загружается, подождите..."
  no-default: "&cПакет ресурсов по умолчанию не настроен."
  not-found: "&cПакет ресурсов '%pack%' не найден."
  file-not-found: "&cФайл пакета ресурсов не найден."
  invalid-path: "&cНеверный путь для пакета ресурсов '%pack%'."
  invalid-pack: "&cПакет ресурсов не найден!"

