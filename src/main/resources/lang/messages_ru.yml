# ResourceLoader — сообщения (Русский)
# Включается параметром language: "ru" в config.yml.
# Используйте & для цветовых кодов (например, &a — зелёный, &c — красный)
# %player% — имя игрока
# %pack% — название пакета ресурсов
# %size% — размер файла
# %current% и %total% — прогресс
# Не переводите заполнители вида %...% и названия команд.

prefix: "&7[&eResourceLoader&7] &r"

general:
  no-permission: "&cУ вас нет прав на использование этой команды."
  reload-success: "&aКонфигурация успешно перезагружена!"
  reload-failed: "&cНе удалось перезагрузить конфигурацию: %error%"
  invalid-pack: "&cПакет ресурсов '%pack%' не найден!"
  players-only: "&cЭту команду могут использовать только игроки."

help:
  header: "&6=== Справка ResourceLoader ==="
  load: "&e/load [pack] &7- Загрузить пакет ресурсов"
  load-specific: "&e/load <pack> &7- Загрузить указанный пакет ресурсов"
  list: "&e/packlist &7- Список доступных пакетов ресурсов"
  autoload: "&e/autoload <pack|clear> &7- Настроить автозагрузку пакета"
  admin-header: "&6=== Команды администратора ==="
  merge: "&e/mergepack <output> <pack1> <pack2> &7- Объединить пакеты ресурсов"
  mergegui: "&e/mergegui <output> &7- Открыть меню объединения"
  remove: "&e/removepack <pack> &7- Удалить пакет ресурсов"
  checkpack: "&e/checkpack <pack> &7- Проверить пакет ресурсов"
  reload: "&e/resourcereload &7- Перезагрузить конфигурацию"
  version: "&e/resourceversion &7- Проверить версию плагина"
  cache: "&e/clearcache &7- Очистить кэш пакетов ресурсов"
  footer: "&6=========================="

resource-packs:
  loading: "&eЗагрузка пакета ресурсов %pack%..."
