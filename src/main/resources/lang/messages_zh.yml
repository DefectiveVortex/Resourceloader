# ResourceLoader 消息（简体中文）
# 在 config.yml 中设置 language: "zh" 即可启用。
# 使用 & 表示颜色代码（例如 &a 为绿色，&c 为红色）
# %player% 玩家名称
# %pack% 资源包名称
# %size% 文件大小
# %current% 和 %total% 进度数字
# 请勿翻译 %...% 占位符和命令名称。

prefix: "&7[&eResourceLoader&7] &r"

general:
  no-permission: "&c你没有权限使用此命令。"
  reload-success: "&a配置已成功重新加载！"
  reload-failed: "&c重新加载配置失败：%error%"
  invalid-pack: "&c未找到资源包 '%pack%'！"
  players-only: "&c此命令只能由玩家使用。"

help:
  header: "&6=== ResourceLoader 帮助 ==="
  load: "&e/load [pack] &7- 加载资源包"
  load-specific: "&e/load <pack> &7- 加载指定的资源包"
  list: "&e/packlist &7- 列出可用的资源包"
  autoload: "&e/autoload <pack|clear> &7- 设置自动加载资源包"
  admin-header: "&6=== 管理员命令 ==="
  merge: "&e/mergepack <output> <pack1> <pack2> &7- 合并资源包"
  mergegui: "&e/mergegui <output> &7- 打开合并界面"
  remove: "&e/removepack <pack> &7- 删除资源包"
  checkpack: "&e/checkpack <pack> &7- 校验资源包"
  reload: "&e/resourcereload &7- 重新加载配置"
  version: "&e/resourceversion &7- 检查插件版本"
  cache: "&e/clearcache &7- 清除资源包缓存"
  footer: "&6=========================="

resource-packs:
  loading: "&e正在加载资源包 %pack%..."
  load-success: "&a资源包加载成功！"
  load-failed: "&c资源包加载失败：%error%"
  download-started: "&e正在下载资源包..."
