  mergegui: "&e/mergegui <output> &7- 병합 메뉴 열기"
  remove: "&e/removepack <pack> &7- 리소스 팩 삭제"
  checkpack: "&e/checkpack <pack> &7- 리소스 팩 검사"
  reload: "&e/resourcereload &7- 설정 다시 불러오기"
