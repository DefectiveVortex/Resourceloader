# ResourceLoader 메시지 (한국어)
# config.yml에서 language: "ko"로 설정하면 사용됩니다.
# 색상 코드는 &를 사용합니다 (예: &a 초록색, &c 빨간색)
# %player% 플레이어 이름
# %pack% 리소스 팩 이름
# %size% 파일 크기
# %current% 및 %total% 진행 상황 숫자
# %...% 형태의 자리 표시자와 명령어 이름은 번역하지 마세요.

prefix: "&7[&eResourceLoader&7] &r"

general:
  no-permission: "&c이 명령어를 사용할 권한이 없습니다."
  reload-success: "&a설정을 성공적으로 다시 불러왔습니다!"
  reload-failed: "&c설정을 다시 불러오지 못했습니다: %error%"
  invalid-pack: "&c리소스 팩 '%pack%'을(를) 찾을 수 없습니다!"
  players-only: "&c이 명령어는 플레이어만 사용할 수 있습니다."

help:
  header: "&6=== ResourceLoader 도움말 ==="
  load: "&e/load [pack] &7- 리소스 팩 불러오기"
